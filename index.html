<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MC Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MC Trainer">
<meta name="theme-color" content="#ECEEEC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --ink:#15181A; --muted:#6B726E; --line:#C9CEC9;
  --cone:#F26A1B; --path:#1D5FC2; --stop:#C43A22; --go:#2E8B57; --grid:#D9DDD9; --dim:#4A5250;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E20; --surface:#24282B; --ink:#ECEEEC; --muted:#9AA29D; --line:#3A4043;
    --cone:#FF7A2E; --path:#7FB0FF; --stop:#F0684E; --go:#5FC08A; --grid:#2F3538; --dim:#B8C0BB;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E20; --surface:#24282B; --ink:#ECEEEC; --muted:#9AA29D; --line:#3A4043;
  --cone:#FF7A2E; --path:#7FB0FF; --stop:#F0684E; --go:#5FC08A; --grid:#2F3538; --dim:#B8C0BB;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;padding:0 16px;padding-block:env(safe-area-inset-top) calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-wrap:balance;margin:0;text-transform:uppercase}
h1{font-size:34px;font-weight:700;letter-spacing:.01em}
h2{font-size:26px;font-weight:600;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-size:15px;color:var(--muted);letter-spacing:.06em;font-weight:500}
h3{font-size:18px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto}
header{padding-block:22px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eyebrow{font-family:"Barlow Condensed",Arial,sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:8px;padding:14px;margin-block:14px 0}
.fig{margin:10px -14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig svg{display:block;height:auto;width:100%}
.fig.wide svg{min-width:720px;width:auto}
.fig text{font-family:"Barlow Condensed",Arial,sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--k)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:15px}
dt{font-family:"Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:14px;padding-top:2px}
dd{margin:0}
.steps{margin:10px 0 0;padding-left:20px;font-size:15px}
.steps li{margin-bottom:6px}
.tag{display:inline-block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--dim)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--path);outline-offset:2px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:"Barlow Condensed",Arial,sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase;width:100%;padding:12px}
.primary:disabled{opacity:.4}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-radius:0;padding:12px 0 10px;font-family:"Barlow Condensed",Arial,sans-serif;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--cone)}
.screen[hidden]{display:none}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:"Barlow Condensed",Arial,sans-serif;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:none;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.chip.done{background:var(--go);border-color:var(--go);color:#fff}
.chip.done.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--go)}
/* session blocks */
.block{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.block .t{grid-column:1;font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:600;text-transform:uppercase}
.block .m{color:var(--muted);font-size:14px;grid-column:1}
.timer{grid-column:2;grid-row:1/3;font-family:"Barlow Condensed",Arial,sans-serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:96px;text-align:center;padding:8px 10px}
.timer.run{border-color:var(--cone);color:var(--cone)}
.timer.over{background:var(--go);border-color:var(--go);color:#fff}
.rate{display:flex;gap:6px;margin-top:6px}
.rate button{width:40px;height:40px;padding:0;font-family:"Barlow Condensed",Arial,sans-serif;font-size:18px;font-weight:600}
.rate button.on{background:var(--cone);border-color:var(--cone);color:#fff}
.goal{font-size:20px;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;line-height:1.25}
.hit{border-left:3px solid var(--go);padding-left:10px;margin-top:10px;font-size:15px}
.trend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px;margin-top:10px;font-variant-numeric:tabular-nums}
.trend b{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;letter-spacing:.04em}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
summary::-webkit-details-marker{display:none}
summary .t{font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:600;text-transform:uppercase}
summary .n{color:var(--muted);font-family:"Barlow Condensed",Arial,sans-serif;font-size:15px;letter-spacing:.06em}
textarea{width:100%;min-height:90px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px}
@media print{
  body{padding:0;background:#fff;color:#000}
  nav,header,#today,#cycle,.no-print{display:none!important}
  #drills[hidden]{display:block!important}
  details{break-inside:avoid;page-break-inside:avoid}
  details>*{display:block}
  .card{box-shadow:none;border:0;margin:0}
  .fig{overflow:visible}
  .fig.wide svg{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow" id="hdr-eyebrow">Cycle 1 · Session 1</div><h1>MC Trainer</h1></div>
  <div class="eyebrow">1 pace ≈ 3'</div>
</header>

<!-- TODAY -->
<section class="screen" id="today"></section>

<!-- CYCLE -->
<section class="screen" id="cycle" hidden></section>

<!-- DRILLS -->
<section class="screen" id="drills" hidden></section>
</div>

<nav aria-label="Screens">
  <button data-go="today" aria-current="page">Today</button>
  <button data-go="cycle">Cycle</button>
  <button data-go="drills">Drills</button>
</nav>

<script>
/* ==========================================================
   MC Trainer — one file. Edit the PLAN and DRILLS arrays
   below to change the program. Everything else is plumbing.
   ========================================================== */

// ---- Range geometry (feet; x along the runway, y across it) ----
// Box width and weave spacing depend on the cycle (they are the only cones that ever move).
function range(cycle){
  const box = cycle>=8 ? 20 : cycle>=7 ? 22 : 24;
  const wv  = cycle>=5 ? 10 : 12;
  return {
    box, wv,
    cones:{
      runway:[[0,10],[0,14],[60,10],[60,14]],
      box:[[120,10],[180,10],[120,10+box],[180,10+box]],
      weave:[0,1,2,3,4].map(i=>[10+i*wv,24]),
      swerve:[[100,12]],
      curve:[[70,32],[88,40],[106,32]],
    }
  };
}
const GROUPS = ['runway','box','weave','swerve','curve'];

// ---- Renderer: everything in feet, scaled by S px/ft ----
function draw(spec, cycle=1){
  if(typeof spec==='function') spec=spec(range(cycle));
  const {view, S=4, hi=GROUPS, path, zones=[], dims=[], labels=[], start} = spec;
  const C = range(cycle).cones;
  const [x0,y0,w,h] = view, P = 4;
  const X = x=> (x-x0+P)*S, Y = y=> (y-y0+P)*S;
  const W = (w+2*P)*S, H = (h+2*P)*S;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img">`;
  s += `<rect width="${W}" height="${H}" fill="var(--surface)"/>`;
  for(let x=Math.ceil(x0/5)*5; x<=x0+w; x+=5) s += `<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y0+h)}" stroke="var(--grid)" stroke-width="${x%20?0.5:1}"/>`;
  for(let y=Math.ceil(y0/5)*5; y<=y0+h; y+=5) s += `<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x0+w)}" y2="${Y(y)}" stroke="var(--grid)" stroke-width="${y%20?0.5:1}"/>`;
  for(const z of zones) s += `<rect x="${X(z.x)}" y="${Y(z.y)}" width="${z.w*S}" height="${z.h*S}" fill="var(--${z.k})" opacity=".18" rx="2"/>`
    + (z.t? `<text x="${X(z.x+z.w/2)}" y="${Y(z.y+z.h)+12}" text-anchor="middle" font-size="11" fill="var(--${z.k})" font-weight="600">${z.t}</text>`:'');
  if(path) s += `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--path)"/></marker></defs>`
    + `<path d="${scalePath(path,X,Y,S)}" fill="none" stroke="var(--path)" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#ah)"/>`;
  if(start) s += `<circle cx="${X(start[0])}" cy="${Y(start[1])}" r="${1.6*S}" fill="var(--go)"/>`;
  for(const [a,b,c,d,t,side=1] of dims){
    const horiz = a!==c && b===d, off = 4*side;
    const ax=X(a), ay=Y(b), bx=X(c), by=Y(d);
    const ox = horiz?0:off*S, oy = horiz?off*S:0;
    s += `<g stroke="var(--dim)" stroke-width="1"><line x1="${ax+ox}" y1="${ay+oy}" x2="${bx+ox}" y2="${by+oy}"/>`
      + `<line x1="${ax}" y1="${ay}" x2="${ax+ox}" y2="${ay+oy}" opacity=".5"/><line x1="${bx}" y1="${by}" x2="${bx+ox}" y2="${by+oy}" opacity=".5"/></g>`
      + `<text x="${(ax+bx)/2+ox+(horiz?0:-5)}" y="${(ay+by)/2+oy+(horiz?(side>0?12:-4):4)}" text-anchor="${horiz?'middle':'end'}" font-size="12" font-weight="600" fill="var(--dim)">${t}</text>`;
  }
  for(const g of GROUPS) for(const [x,y] of C[g]){
    const on = hi.includes(g);
    s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${1.3*S}" fill="var(--cone)" opacity="${on?1:.28}"/>`
      + (on? `<circle cx="${X(x)-S*.35}" cy="${Y(y)-S*.4}" r="${S*.3}" fill="#fff" opacity=".7"/>`:'');
  }
  for(const [x,y,t,anchor='start'] of labels) s += `<text x="${X(x)}" y="${Y(y)}" font-size="13" font-weight="700" letter-spacing=".08em" fill="var(--ink)" text-anchor="${anchor}">${t}</text>`;
  return s + '</svg>';
}
function scalePath(d,X,Y,S){
  return d.replace(/([MLQA])\s*([^MLQA]+)/g,(m,cmd,args)=>{
    const n = args.trim().split(/[\s,]+/).map(Number);
    if(cmd==='A') return `A ${n[0]*S} ${n[1]*S} ${n[2]} ${n[3]} ${n[4]} ${X(n[5])} ${Y(n[6])}`;
    let out = cmd; for(let i=0;i<n.length;i+=2) out += ` ${X(n[i])} ${Y(n[i+1])}`; return out;
  });
}
function rangeFig(cycle){
  const {box,wv} = range(cycle);
  return draw({
    view:[-4,4,190,44], S:4,
    dims:[[0,10,60,10,"60'",-1],[60,10,120,10,"60'",-1],[120,10+box,180,10+box,"60'",1],[0,10,0,14,"4'",-1],[120,10,120,10+box,box+"'",-1],[10,24,10+wv,24,wv+"'",1],[60,14,100,14,"40'",1]],
    labels:[[2,19,"RUNWAY"],[124,7,`BOX ${box}'×60'`],[62,29,"WEAVE"],[96,10,"SWERVE"],[64,45,"CURVE"]],
  }, cycle);
}

// ---- Drills. Every drill MUST have: name, fam, cones, obj, cue, fault, fig. ----
const RUN = [[0,10,60,10,"60'",-1],[0,10,0,14,"4'",-1]];
const DRILLS = {
 1:{name:"Friction-zone walk", fam:"Clutch control", cones:"Runway",
    obj:"Find the friction zone. Ease the clutch out until the bike creeps, walk it 10–15', squeeze, repeat down the lane. Feet stay on the ground.",
    cue:"Fingers move a quarter inch at a time. No throttle beyond a steady idle-plus. Feel for the moment the bike starts to pull.",
    fault:"Dumping the clutch. If it lurches, you released past the zone — smaller movements.",
    fig:{view:[-4,4,70,16], S:6, hi:['runway'], start:[0,12], path:"M 2 12 L 22 12 M 26 12 L 46 12", dims:RUN, labels:[[2,19,"creep · squeeze · creep"]]}},
 2:{name:"Power walk → feet up", fam:"Clutch + throttle", cones:"Runway",
    obj:"Walk the bike in the friction zone. By the 30' mark, both feet on the pegs. Ride to 60', stop, feet down.",
    cue:"Look at the far cones, not the tank. Feet come up as soon as the bike is pulling on its own — earlier than feels natural.",
    fault:"Paddling. Feet dragging past 30' means you're not trusting the friction zone yet — go back to drill 1 for a lap.",
    fig:{view:[-4,4,70,16], S:6, hi:['runway'], start:[0,12], path:"M 2 12 L 58 12", dims:RUN, zones:[{x:28,y:9,w:4,h:6,k:'go',t:"feet up"}], labels:[[2,19,"walk → ride"]]}},
 3:{name:"Slow straight ride", fam:"Balance at walking pace", cones:"Runway",
    obj:"Ride the 4' lane from 0' to 60' as slowly as you can, feet up the whole way, without touching a cone or dabbing.",
    cue:"Head up, eyes on the far pair. Throttle steady, clutch in the zone, a little rear brake to hold speed. Knees on the tank.",
    fault:"Staring at the front wheel. The bike wobbles because your eyes dropped.",
    fig:{view:[-4,4,70,16], S:6, hi:['runway'], start:[0,12], path:"M 2 12 L 58 12", dims:RUN, labels:[[2,19,"feet up entire lane"]]}},
 4:{name:"Shift up, shift down, stop", fam:"Shifting", cones:"Runway + box near edge",
    obj:"Launch, shift to 2nd by the 60' pair, roll off, downshift to 1st and stop with the front tire on the 120' line.",
    cue:"Roll off, clutch in, tap the shifter, clutch out smoothly — one motion. Downshift while still moving, before the stop.",
    fault:"Stopping in 2nd. Get the downshift done early so the bike is ready to move again.",
    fig:{view:[-4,4,128,16], S:4, hi:['runway','box'], start:[0,12], path:"M 2 12 L 117 12", zones:[{x:119,y:9,w:2,h:6,k:'stop',t:"stop line"}], dims:[[0,10,60,10,"60' — up to 2nd",-1],[60,10,120,10,"60' — down to 1st",-1]], labels:[[2,19,"START"]]}, wide:true},
 5:{name:"Normal stop at a marker", fam:"Braking", cones:"Runway + box near edge",
    obj:"At 10–15 mph, stop with the front tire inside a 2' zone at the 120' line. Both brakes, smooth, straight up.",
    cue:"Squeeze the front, press the rear, clutch in as you slow. Left foot down first at the stop, right foot on the brake.",
    fault:"Overshooting. Start braking earlier and squeeze less — the goal is precision, not force.",
    fig:{view:[-4,4,128,16], S:4, hi:['runway','box'], start:[0,12], path:"M 2 12 L 117 12", zones:[{x:119,y:9,w:2,h:6,k:'stop',t:"2' zone"}], dims:[[0,10,60,10,"60' — 10–15 mph",-1],[60,10,120,10,"60'",-1]], labels:[[2,19,"START"]]}, wide:true},
 6:{name:"Quick stop", fam:"Emergency braking", cones:"Runway + swerve cone as speed marker",
    obj:"Build to 15–20 mph by the 60' pair. At the swerve cone, stop as short as you can, straight up, front wheel inside the 20' brake zone.",
    cue:"Both brakes at once, squeeze — don't grab. Front brake does most of the work; add pressure as weight moves forward. Clutch in, downshift to first, head up at the horizon.",
    fault:"Rear lock (chirp). If it locks, keep it locked until stopped — releasing mid-skid can high-side. Ease the rear pressure next rep.",
    fig:{view:[-4,4,128,16], S:4, hi:['runway','swerve','box'], start:[0,12], path:"M 2 12 L 99 12", zones:[{x:100,y:9,w:20,h:6,k:'stop',t:"brake zone 20'"}], dims:[[0,10,60,10,"60' — reach 15–20 mph",-1],[60,10,100,10,"40'",-1]], labels:[[2,19,"START"]]}, wide:true},
 7:{name:"Slow cone weave", fam:"Slow speed · handlebar steering", cones:"Weave line",
    obj:"Ride the five cones at walking pace without touching one, then come back through the other way.",
    cue:"Head and eyes on the last cone, not the one beside you. Steady throttle, clutch in the friction zone, light drag on the rear brake.",
    fault:"Looking down at the cone you're passing. Where you look is where you go.",
    fig:{view:[-4,16,72,18], S:6, hi:['weave'], start:[0,24], path:"M 2 24 Q 10 18 16 24 Q 22 30 28 24 Q 34 18 40 24 Q 46 30 52 24 Q 58 18 66 24", dims:[[10,24,22,24,"12'",1]], labels:[[0,20,"walking pace →"]]}},
 8:{name:"Press to turn", fam:"Counter-steering", cones:"Runway + swerve cone",
    obj:"At 12–15 mph, press the right grip forward: the bike leans and goes right. Move one lane over past the swerve cone, then press left to come back.",
    cue:"Press, don't pull. A firm press on the grip in the direction you want to go. Look where you want to end up.",
    fault:"Steering the bars like a bicycle. Above walking pace, pressing is what leans the bike — trust it.",
    fig:{view:[-4,4,128,20], S:4, hi:['runway','swerve'], start:[0,12], path:"M 2 12 L 80 12 Q 92 12 96 18 L 108 18 Q 114 18 118 12", dims:[[0,10,60,10,"60' — 12–15 mph",-1]], labels:[[82,24,"press right → right"]]}, wide:true},
 9:{name:"Curve: outside, inside, outside", fam:"Cornering · vision", cones:"Curve arc",
    obj:"Enter wide, apex at the middle cone, exit wide. Slow before the curve, look through it, roll on the throttle from the apex out.",
    cue:"Slow · look · press · roll. All braking done before you lean. Turn your head first; the bike follows.",
    fault:"Braking in the curve. Set your speed early and the curve gets easy.",
    fig:{view:[56,20,64,26], S:5, hi:['curve'], start:[60,25], path:"M 62 26 Q 88 36 114 26", labels:[[62,45,"outside · inside · outside"]]}},
 10:{name:"Swerve", fam:"Obstacle avoidance", cones:"Runway + swerve cone",
    obj:"At 12–15 mph ride straight at the swerve cone. Two quick presses: right to miss it, left to straighten. Then again, passing left.",
    cue:"Press, press. Keep the throttle steady and your body upright — let the bike lean under you. No brakes during the swerve.",
    fault:"Braking and swerving at once. Do one or the other; braking in the swerve is how the front tucks.",
    fig:{view:[-4,4,128,16], S:4, hi:['runway','swerve'], start:[0,12], path:"M 2 12 L 92 12 Q 96 12 98 8 L 102 8 Q 104 8 108 12 L 118 12", dims:[[0,10,60,10,"60' — 12–15 mph",-1]], labels:[[86,19,"press R · press L"]]}, wide:true},
 11:{name:"U-turn in the box", fam:"Limited-space maneuvers", cones:"Box",
    obj:"Enter the box down one long side and turn 180° inside the width without a foot down. Then the other direction.",
    cue:"Slow before the turn, turn your head all the way to the exit, counter-weight (push the outside peg), keep the throttle steady and let the clutch and rear brake set the speed.",
    fault:"Chopping the throttle mid-turn. Speed drops, the bike wants to fall in. Keep the engine pulling and control speed with the clutch.",
    fig:r=>({view:[96,4,90,36], S:5, hi:['box','swerve'], start:[100,12], path:`M 102 12.5 L 158 12.5 A ${r.box/2-2.5} ${r.box/2-2.5} 0 0 1 158 ${7.5+r.box} L 118 ${7.5+r.box}`, dims:[[120,10,180,10,"60'",-1],[120,10,120,10+r.box,r.box+"'",-1]], labels:[[121,40,`box is ${r.box}' this cycle`]]})},
 12:{name:"Figure-8 in the box", fam:"Combined slow-speed", cones:"Box",
    obj:"Two U-turns linked into a figure-8, all inside the box, no foot down. Left loop then right loop.",
    cue:"Everything from the U-turn, twice: head around early, steady throttle, clutch and rear brake set the speed. Straighten for a beat at the crossing.",
    fault:"Rushing the crossing. Let the bike stand up for a moment between loops so the second turn starts from balance.",
    fig:r=>{const m=10+r.box/2, t=11, b=9+r.box; return {view:[112,4,76,36], S:5, hi:['box'], start:[150,m], path:`M 150 ${m} Q 176 ${t} 176 ${m} Q 176 ${b} 150 ${m} Q 124 ${t} 124 ${m} Q 124 ${b} 150 ${m}`, dims:[[120,10,180,10,"60'",-1],[120,10,120,10+r.box,r.box+"'",-1]]};}},
 13:{name:"Skills lap", fam:"Everything, linked", cones:"Whole Range",
    obj:"Runway launch → swerve → U-turn in the box → curve → weave back → normal stop at the start. Repeat until time's up.",
    cue:"Each element gets its own cue. The lap is about transitions: set speed early for the next element while finishing this one.",
    fault:"Carrying runway speed into the box. Slow down before the box edge, not inside it.",
    fig:{view:[-4,4,190,44], S:4, start:[0,12], path:"M 2 12 L 92 12 Q 98 8 108 12 L 158 12.5 A 9.5 9.5 0 0 1 158 31.5 L 114 30 Q 88 38 66 24 Q 58 18 52 24 Q 46 30 40 24 Q 34 18 28 24 Q 22 30 16 24 Q 10 18 2 24", labels:[[2,19,"START"]]}, wide:true},
};
for(const [n,d] of Object.entries(DRILLS)) for(const k of ['name','fam','cones','obj','cue','fault','fig']) if(!d[k]) throw new Error(`Drill ${n} is missing "${k}"`);

// ---- The plan: 8 cycles. Each session = [drill A (8 min), drill B (6 min)]. ----
// Bonus sessions are skills laps on the whole Range plus the cycle's primary drill.
const PLAN = [
 {goal:"Own the friction zone", hit:"Ride the 4' lane 0'→60' at walking pace, feet up, no dab — three times in a row.", core:[[1,2],[2,3],[3,5]], primary:3},
 {goal:"Slow-speed balance", hit:"Full weave both directions, feet up, no cone touched.", core:[[7,3],[7,5],[7,3]], primary:7},
 {goal:"Clean shifting and stopping", hit:"Front tire in the 2' zone on 3 of 4 stops.", core:[[4,5],[5,4],[6,5]], primary:5},
 {goal:"Lean to turn", hit:"Outside–inside–outside line through the curve on every lap.", core:[[8,9],[9,7],[9,8]], primary:9},
 {goal:"Quick stop", hit:"Quick stop from ~20 mph with no rear lock and no stall, 3 of 4.", core:[[6,5],[6,9],[6,7]], primary:6},
 {goal:"Swerve", hit:"Clean swerve around the cone at ~15 mph, both directions.", core:[[10,8],[10,6],[10,9]], primary:10},
 {goal:"The box", hit:"Two U-turns inside the box, no foot down. Box is 22' this cycle.", core:[[11,7],[11,12],[11,7]], primary:11},
 {goal:"Combine and tighten", hit:"Figure-8 in the 20' box, then a quick stop, back-to-back.", core:[[12,6],[11,10],[12,6]], primary:12},
];
const SESSIONS = c => [...PLAN[c-1].core.map((d,i)=>({key:`c${c}s${i+1}`,label:`Core ${i+1}`,core:true,drills:d})),
                       [1,2].map(i=>({key:`c${c}b${i}`,label:`Bonus ${i}`,core:false,drills:[13,PLAN[c-1].primary]}))].flat();

// ---- State ----
const KEY='mct.v1';
let state = {done:{}};
try{ state = JSON.parse(localStorage.getItem(KEY)) || state; }catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const coreDone = c => PLAN[c-1].core.filter((_,i)=>state.done[`c${c}s${i+1}`]).length;
const currentCycle = ()=>{ for(let c=1;c<=8;c++) if(coreDone(c)<3) return c; return 8; };
let viewCycle = currentCycle();
let viewSession = null; // key
let timers = {};

// ---- Today ----
function renderToday(){
  const c = viewCycle, p = PLAN[c-1], sessions = SESSIONS(c);
  if(!viewSession || !sessions.find(s=>s.key===viewSession)) viewSession = (sessions.find(s=>s.core && !state.done[s.key]) || sessions[0]).key;
  const s = sessions.find(x=>x.key===viewSession), done = state.done[s.key];
  const {box,wv} = range(c);
  document.getElementById('hdr-eyebrow').textContent = `Cycle ${c} · ${s.label}`;
  const [A,B] = s.drills;
  const block = (n,min,slot)=>{ const d=DRILLS[n]; return `
    <div class="block">
      <div class="t">${slot} · ${d.name}</div>
      <button class="timer" data-timer="${slot}" data-min="${min}">${min}:00</button>
      <div class="m">${min} min · ${d.fam}</div>
    </div>
    <div class="fig ${d.wide?'wide':''}">${draw(d.fig,c)}</div>
    <dl><dt>Objective</dt><dd>${d.obj}</dd><dt>Cue</dt><dd>${d.cue}</dd><dt>Fault</dt><dd>${d.fault}</dd></dl>
    ${done ? '' : `<div class="rate" data-rate="${n}" aria-label="Rate ${d.name} 1 to 5">${[1,2,3,4,5].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>`}`; };
  document.getElementById('today').innerHTML = `
    <section class="card">
      <div class="eyebrow">Cycle ${c} of 8 · goal</div>
      <div class="goal">${p.goal}</div>
      <div class="hit">${p.hit}</div>
      <div class="chips">${sessions.map(x=>`<button class="chip ${x.key===viewSession?'on':''} ${state.done[x.key]?'done':''}" data-session="${x.key}">${x.label}</button>`).join('')}</div>
    </section>
    <section class="card">
      <div class="block" style="border-top:0">
        <div class="t">Set the Range</div>
        <button class="timer" data-timer="setup" data-min="4">4:00</button>
        <div class="m">4 min · 17 cones · box ${box}' · weave ${wv}' · one easy lap</div>
      </div>
      <div class="fig wide">${rangeFig(c)}</div>
      <details class="no-print"><summary><span class="n">Cone placement steps</span></summary>
        <ol class="steps">
          <li><b>Runway line A.</b> A straight line along the lot. Cone at 0', cone at 60' (20 paces).</li>
          <li><b>Runway line B.</b> 4' to the right of A. Cones at 0' and 60'.</li>
          <li><b>Swerve cone.</b> On line A's centerline, at 100'.</li>
          <li><b>Box.</b> Near corners at 120' on line A and ${box}' to the right. Far corners 60' further. Four cones.</li>
          <li><b>Weave.</b> A line 10' right of line B, starting at 10'. Five cones, ${wv}' apart.</li>
          <li><b>Curve.</b> Three cones marking the outside of an arc below the swerve cone: 70', 88' (8' deeper), 106'.</li>
        </ol></details>
      ${block(A,8,'A')}
      ${block(B,6,'B')}
      <div class="block"><div class="t">Cool down</div><button class="timer" data-timer="cool" data-min="2">2:00</button><div class="m">2 min · one slow lap, then rate the drills</div></div>
      <div style="margin-top:14px">
        ${done ? `<div class="row"><span>Done ${new Date(done.ts).toLocaleDateString()} · rated A ${done.r[A]??'–'} · B ${done.r[B]??'–'}</span><button data-undo="${s.key}">Undo</button></div>`
               : `<button class="primary" id="mark" disabled>Rate both drills to finish</button>`}
      </div>
    </section>`;
  const ratings = {};
  const q = sel => document.querySelectorAll(sel);
  q('#today [data-session]').forEach(b=>b.onclick=()=>{ viewSession=b.dataset.session; stopTimers(); renderToday(); });
  q('#today .rate').forEach(r=>r.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    ratings[r.dataset.rate]=+b.dataset.v; r.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const m=document.getElementById('mark'); if(ratings[A]&&ratings[B]){ m.disabled=false; m.textContent='Mark session done'; }
  }));
  const mark=document.getElementById('mark'); if(mark) mark.onclick=()=>{ state.done[s.key]={ts:Date.now(),r:{...ratings}}; save(); stopTimers(); viewCycle=currentCycle(); viewSession=null; renderToday(); window.scrollTo(0,0); };
  q('#today [data-undo]').forEach(b=>b.onclick=()=>{ delete state.done[b.dataset.undo]; save(); renderToday(); });
  q('#today [data-timer]').forEach(b=>b.onclick=()=>toggleTimer(b));
}
function toggleTimer(b){
  const id=b.dataset.timer;
  if(timers[id]){ clearInterval(timers[id].iv); delete timers[id]; b.className='timer'; b.textContent=b.dataset.min+':00'; return; }
  let left=+b.dataset.min*60; b.className='timer run';
  const tick=()=>{ if(left<=0){ b.className='timer over'; b.textContent='Done'; clearInterval(timers[id].iv); return; }
    b.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; left--; };
  tick(); timers[id]={iv:setInterval(tick,1000)};
}
function stopTimers(){ for(const t of Object.values(timers)) clearInterval(t.iv); timers={}; }

// ---- Cycle ----
function renderCycle(){
  const c=viewCycle, p=PLAN[c-1], sessions=SESSIONS(c);
  const drillIds=[...new Set(p.core.flat())];
  const trend = drillIds.map(n=>{ const rs=[]; for(let cc=1;cc<=8;cc++) for(const s of SESSIONS(cc)){ const d=state.done[s.key]; if(d&&d.r[n]) rs.push(d.r[n]); }
    return `<b>${DRILLS[n].name}</b><span>${rs.length? rs.join(' → ') : '—'}</span>`; }).join('');
  document.getElementById('cycle').innerHTML=`
    <section class="card">
      <div class="row" style="margin-top:0"><button data-cyc="${c-1}" ${c<=1?'disabled':''}>◀ Cycle ${c-1}</button><button data-cyc="${c+1}" ${c>=8?'disabled':''}>Cycle ${c+1} ▶</button></div>
      <div class="eyebrow" style="margin-top:12px">Cycle ${c} of 8 · strategic goal</div>
      <div class="goal">${p.goal}</div>
      <div class="hit"><b>Hit it:</b> ${p.hit}</div>
      <div class="chips">${sessions.map(x=>`<button class="chip ${state.done[x.key]?'done':''}" data-session="${x.key}">${x.label}</button>`).join('')}</div>
      <p class="note">${coreDone(c)} of 3 core sessions done. The cycle advances when all three are.</p>
      <h3 style="margin-top:14px">Ratings, all time</h3>
      <div class="trend">${trend}</div>
      <h3 style="margin-top:14px">Sessions</h3>
      <dl>${sessions.map(x=>`<dt>${x.label}</dt><dd>${DRILLS[x.drills[0]].name} · ${DRILLS[x.drills[1]].name}</dd>`).join('')}</dl>
    </section>
    <section class="card no-print">
      <h3>Backup</h3>
      <p class="note">Progress lives on this phone. Export before switching phones or clearing Safari data.</p>
      <div class="row"><button id="exp">Export progress</button><button id="imp">Import from text below</button></div>
      <textarea id="io" placeholder="Exported progress appears here. Paste here to import."></textarea>
    </section>`;
  document.querySelectorAll('#cycle [data-cyc]').forEach(b=>b.onclick=()=>{ viewCycle=+b.dataset.cyc; viewSession=null; renderCycle(); });
  document.querySelectorAll('#cycle [data-session]').forEach(b=>b.onclick=()=>{ viewSession=b.dataset.session; go('today'); });
  document.getElementById('exp').onclick=()=>{ const t=document.getElementById('io'); t.value=JSON.stringify(state); t.select(); navigator.clipboard?.writeText(t.value).catch(()=>{}); };
  document.getElementById('imp').onclick=()=>{ try{ const v=JSON.parse(document.getElementById('io').value); if(v&&v.done){ state=v; save(); viewCycle=currentCycle(); renderCycle(); } }catch(e){ alert('That is not exported progress.'); } };
}

// ---- Drills library ----
function renderDrills(){
  document.getElementById('drills').innerHTML=`<section class="card"><h2>Drills <small>12 + the skills lap</small></h2>`+
    Object.entries(DRILLS).map(([n,d])=>`<details><summary><span class="t">${n}. ${d.name}</span><span class="n">${d.fam}</span></summary>
      <div class="fig ${d.wide?'wide':''}">${draw(d.fig,viewCycle)}</div>
      <dl><dt>Cones</dt><dd>${d.cones} <span class="tag">0 moves</span></dd><dt>Objective</dt><dd>${d.obj}</dd><dt>Cue</dt><dd>${d.cue}</dd><dt>Fault</dt><dd>${d.fault}</dd></dl></details>`).join('')+`</section>`;
}

// ---- Nav ----
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.hidden = s.id!==id);
  document.querySelectorAll('nav button').forEach(b=>{ if(b.dataset.go===id) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  ({today:renderToday, cycle:renderCycle, drills:renderDrills})[id]();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
go('today');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
